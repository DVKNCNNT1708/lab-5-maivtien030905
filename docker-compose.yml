services:
  db:
    image: postgres:15
    container_name: lab05-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lab05_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lab05_password}
      POSTGRES_DB: ${POSTGRES_DB:-lab05_db}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - team-internal

  ai-service:
    build:
      context: ./src/ai_service
      dockerfile: Dockerfile
    container_name: lab05-ai-service
    restart: unless-stopped
    env_file:
      - .env
    environment:
      AI_SERVICE_PORT: ${AI_SERVICE_PORT}
    ports:
      - "9000:9000"
    depends_on:
      - db
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:${AI_SERVICE_PORT:-9000}/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - team-internal

  core-business:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lab05-core-business
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - team-internal

volumes:
  db-data:

networks:
  team-internal:
    driver: bridge
